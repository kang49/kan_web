name: Deploy kan_web to g49node0

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            set -e
            export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"
            [ -s "$HOME/.nvm/nvm.sh" ] && . "$HOME/.nvm/nvm.sh"

            APP_DIR="${{ secrets.VPS_APP_DIR }}"
            APP_DIR="${APP_DIR:-/home/kang49/run_server/nodejs/kan_web}"

            if [ "$(stat -c '%U' "$APP_DIR")" != "$USER" ]; then
              printf '%s\n' "${{ secrets.VPS_PASSWORD }}" | sudo -S chown -R "$USER:$USER" "$APP_DIR"
            fi

            cd "$APP_DIR"
            git config --global --add safe.directory "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main

            if [ -f yarn.lock ]; then
              yarn install --frozen-lockfile
            else
              yarn install
            fi
            yarn build

            if printf '%s\n' "${{ secrets.VPS_PASSWORD }}" | sudo -S pm2 describe kan_web >/dev/null 2>&1; then
              printf '%s\n' "${{ secrets.VPS_PASSWORD }}" | sudo -S pm2 restart kan_web
              printf '%s\n' "${{ secrets.VPS_PASSWORD }}" | sudo -S pm2 save
            elif command -v pm2 >/dev/null 2>&1; then
              pm2 restart kan_web || PORT=3006 pm2 start .output/server/index.mjs --name kan_web
              pm2 save
            elif systemctl list-unit-files | grep -q '^kan_web\.service'; then
              sudo systemctl restart kan_web
            else
              echo "Built .output/server/index.mjs; configure PM2 or systemd (kan_web.service) to keep it running."
            fi
